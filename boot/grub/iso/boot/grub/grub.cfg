# ──────────────────────────────────────────────────────────────────────────
# grub.cfg — GRUB2 Configuration for TriniOS (minimal)
# ──────────────────────────────────────────────────────────────────────────

set timeout=5
set default=0

# Minimal modules only
insmod multiboot2
insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod gzio
insmod all_video

menuentry "TriniOS (Kernel Only)" --id trini {
    echo "[TRINI] Loading kernel..."
    multiboot2 /boot/trini-kernel.bin
    echo "[TRINI] Kernel loaded, booting..."
}

menuentry "TriniOS (With Initrd)" --id trini-initrd {
    echo "[TRINI] Loading kernel..."
    multiboot2 /boot/trini-kernel.bin module /boot/initrd.img
    echo "[TRINI] Booting with initrd..."
}

menuentry "Debug: list devices" --id debug-devices {
    echo "--- Devices ---"
    ls
    echo "--- /boot contents ---"
    ls (cd)/boot/
    echo "--- /boot/grub contents ---"
    ls (cd)/boot/grub/
    echo "--- Kernel file check ---"
    ls -l (cd)/boot/trini-kernel.bin
    echo "--- Initrd file check ---"
    ls -l (cd)/boot/initrd.img
    echo "--- Done listing ---"
    echo "Press Enter to boot kernel..."
    set default=0
    set timeout=10
}

menuentry "Debug: test multiboot2 module loading" --id debug-modules {
    insmod initrd
    insmod chain
    echo "[TRINI] Modules loaded successfully"
    multiboot2 /boot/trini-kernel.bin
    boot
}