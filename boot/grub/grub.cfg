# ──────────────────────────────────────────────────────────────────────────
# grub.cfg — GRUB2 Configuration for TriniOS
# ──────────────────────────────────────────────────────────────────────────
#
# This file configures GRUB2's boot menu. Place it at:
#   /boot/grub/grub.cfg   (BIOS/legacy)
#   /EFI/boot/grub.cfg    (UEFI)
#
# ──────────────────────────────────────────────────────────────────────────

# Timeout before auto-booting default entry (seconds)
set timeout=5

# Default boot entry (0 = first menu entry)
set default=0

# Use GRUB2's multiboot2 module
insmod multiboot2
insmod all_video
insmod font
insmod gfxterm
insmod echo
insmod sleep

# Set terminal graphics mode
insmod video
insmod gfxterm
terminal_output gfxterm

# ── Menu Entry 1: TriniOS (Normal Boot) ──────────────────────────────────
menuentry "TriniOS" --id trini-normal {
    # Kernel load address: 0x100000 (1 MB, standard multiboot load point)
    multiboot2 /boot/trini-kernel.bin
    # Initrd (loaded as a module)
    initrd12  /boot/initrd.img
    # Kernel command line
    boot "root=initrd console=tty0"
}

# ── Menu Entry 2: TriniOS (Verbose/Debug) ────────────────────────────────
menuentry "TriniOS (Debug)" --id trini-debug {
    multiboot2 /boot/trini-kernel.bin debug verbose
    initrd12  /boot/initrd.img
    boot "root=initrd console=tty0 debug"
}

# ── Menu Entry 3: TriniOS (No initrd — kernel only) ──────────────────────
menuentry "TriniOS (Kernel Only)" --id trini-kernel-only {
    multiboot2 /boot/trini-kernel.bin
    boot
}

# ── Menu Entry 4: Memory Test (if available) ─────────────────────────────
menuentry "Memory Test" --id memtest {
    search --set=root --file /boot/memtest.bin
    multiboot2 /boot/memtest.bin
}

# ── Menu Entry 5: Reboot ─────────────────────────────────────────────────
menuentry "Reboot" --id reboot {
    reboot
}

# ── Menu Entry 6: Shutdown ───────────────────────────────────────────────
menuentry "Shutdown" --id shutdown {
    halt
}