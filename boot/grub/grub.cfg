# ──────────────────────────────────────────────────────────────────────────
# grub.cfg — GRUB2 Configuration for TriniOS (minimal)
# ──────────────────────────────────────────────────────────────────────────

set timeout=5
# Default to the full system (kernel + initrd): hello and the coreutils live
# in the initrd, so a kernel-only boot has no user space. The kernel-only
# entry stays available for debugging.
set default=1

# Minimal modules only
insmod multiboot2
insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod gzio
insmod all_video

# NOTE: the load is wrapped in if/else because a failed 'multiboot2' command
# used to fall through silently — the script printed 'Kernel loaded, booting...' even when GRUB had rejected the header (round-6 lesson).
menuentry "TriniOS (Kernel Only)" --id trini {
    echo "[TRINI] Loading kernel..."
    if multiboot2 /boot/trini-kernel.bin; then
        echo "[TRINI] Kernel loaded, booting..."
        boot
    else
        echo "[TRINI] KERNEL LOAD FAILED — see GRUB error above"
        echo "[TRINI] The ISO likely holds a stale kernel: rebuild with run_qemu.sh -b"
        sleep 10
    fi
}

menuentry "TriniOS (With Initrd)" --id trini-initrd {
    echo "[TRINI] Loading kernel..."
    if multiboot2 /boot/trini-kernel.bin module /boot/initrd.img; then
        echo "[TRINI] Kernel + initrd loaded, booting..."
        boot
    else
        echo "[TRINI] KERNEL LOAD FAILED — see GRUB error above"
        echo "[TRINI] The ISO likely holds a stale kernel: rebuild with run_qemu.sh -b"
        sleep 10
    fi
}

menuentry "Debug: list devices" --id debug-devices {
    echo "--- Devices ---"
    ls
    echo "--- /boot contents ---"
    ls (cd)/boot/
    echo "--- /boot/grub contents ---"
    ls (cd)/boot/grub/
    echo "--- Kernel file check ---"
    ls -l (cd)/boot/trini-kernel.bin
    echo "--- Initrd file check ---"
    ls -l (cd)/boot/initrd.img
    echo "--- Done listing ---"
    echo "Press Enter to boot kernel..."
    set default=0
    set timeout=10
}

menuentry "Debug: test multiboot2 module loading" --id debug-modules {
    insmod initrd
    insmod chain
    echo "[TRINI] Modules loaded successfully"
    multiboot2 /boot/trini-kernel.bin
    boot
}